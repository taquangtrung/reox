# The crates of reox: the regex engine, and its benchmark, a crate of its
# own so reox never depends on the engines it is measured against.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Trung Ta <taquangtrungvn@gmail.com>"]
license = "MIT OR Apache-2.0"
# The verified floor: `rust-toolchain.toml` pins 1.100.0.
rust-version = "1.100"
repository = "https://github.com/taquangtrung/reox"

[workspace.dependencies]
# The engines the benchmark measures reox against.
fancy-regex = "0.20"
# Finds the bytes a match may start with.
memchr = "2"
# Oniguruma itself, the reference the tests compare reox against.
onig = "6"
# The automata hot patterns run on, where they need no backtracking.
regex-automata = "0.4"
# Unicode classes and case folding: properties, POSIX classes, `\w`.
regex-syntax = "0.8"
# Reads grammars for the benchmark's patterns.
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

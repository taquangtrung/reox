# The crates of reox: the regex engine, and its benchmark, a crate of its
# own so reox never depends on the engines it is measured against.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
authors = ["Trung Ta <taquangtrungvn@gmail.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.100"
repository = "https://github.com/taquangtrung/reox"

[workspace.dependencies]
memchr = "2"
onig = "6"
regex-automata = "0.4"
regex-syntax = "0.8"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
